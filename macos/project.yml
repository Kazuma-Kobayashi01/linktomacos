name: LinkToMacOS
options:
  bundleIdPrefix: com.linktomacos
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  LinkCore:
    path: Packages/LinkCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 免费账号阶段：本地签名运行（Sign to Run Locally）
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  LinkToMacOS:
    type: application
    platform: macOS
    sources:
      - LinkToMacOS
    dependencies:
      - package: LinkCore
    info:
      path: LinkToMacOS/Info.plist
      properties:
        CFBundleDisplayName: LinkToMacOS
        LSUIElement: true
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja]
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Used to find and connect to your Android phone on the local network.
        NSBonjourServices:
          - _linktomacos._tcp
        NSBluetoothAlwaysUsageDescription: Used to make and answer phone calls from this Mac over Bluetooth.
        NSMicrophoneUsageDescription: Used to send your voice to the phone while mirroring, and when making or answering phone calls on this Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linktomacos.mac
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
